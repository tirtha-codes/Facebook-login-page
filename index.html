<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="parent">
        <div id="main">
            <div id="left">
                <div id="left-top">
                    <img src="fb_logo.png" height="60px" width="60px">
                </div>
                <div id="left-bottom">
                    <div id="left-bottom-left">
                        <p id="display_text">Explore the things <span style="color: #1877F2;">you love.</span></p>
                    </div>
                    <div id="left-bottom-right">
                        <img src="front_image_2.png" height="400px" width="350px">
                    </div>
                </div>
            </div>
            <div id="right">
                <div id="right-top">
                    <p id="login-to-fb">Log in to Facebook</p>
                </div>
                <div id="right-middle">
                    <input type="text" id="email" placeholder="  E-mail address or mobile number"><br>
                    <input type="password" id="pass" placeholder="  Password"><br>
                    <input type="button" id="login" value="Log in"><br>
                    <input type="button" id="forgotten-pass" value="Forgotten Password?">
                </div>
                <div id="right-bottom">
                    <input type="button" id="create-new-acc" value="Create new account">
                    <img src="meta_logo.png" id="meta" height="30px" width="70px">
                </div>
            </div>
        </div>
        <div id="footer">

        </div>
    </div>
</body>

</html>
